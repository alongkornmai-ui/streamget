<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stream Recorder UI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    h2 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 12px;
      color: #f1f1f1;
    }

    /* Card Layout */
    .card {
      background-color: #161618;
      border: 1px solid #26262a;
      border-radius: 16px;
      padding: 16px;
    }

    /* Quick Record */
    .quick-record-box {
      display: flex;
      gap: 12px;
    }

    .input-field {
      flex: 1;
      background-color: #0d0d0d;
      border: 1px solid #26262a;
      border-radius: 12px;
      padding: 12px 16px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
    }

    .input-field::placeholder {
      color: #52525b;
    }

    .btn-record {
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 12px;
      padding: 12px 24px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
    }

    /* Activity Section */
    .activity-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .activity-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background-color: #27272a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: #a1a1aa;
      font-size: 0.9rem;
      object-fit: cover;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .username {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .status-meta {
      font-size: 0.8rem;
      color: #e11d48;
    }

    .status-meta.muted {
      color: #71717a;
    }

    .btn-action {
      background-color: transparent;
      border: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 6px 12px;
    }

    .badge-recording {
      background-color: #3f121d;
      color: #f43f5e;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
      font-weight: 500;
    }

    .badge-queued {
      background-color: #27272a;
      color: #a1a1aa;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .divider {
      height: 1px;
      background-color: #26262a;
      margin: 8px 0;
    }

    /* Empty State */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 0;
      color: #71717a;
      gap: 8px;
    }

    .empty-icon {
      width: 24px;
      height: 24px;
      border: 2px solid #52525b;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    /* Overview Section */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat-box {
      background-color: #161618;
      border: 1px solid #26262a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .stat-number {
      font-size: 1.4rem;
      font-weight: 700;
      color: #ffffff;
    }

    .stat-label {
      font-size: 0.75rem;
      color: #71717a;
    }
  </style>
</head>
<body>

  <!-- Quick Record -->
  <section>
    <h2>Quick record</h2>
    <div class="card">
      <div class="quick-record-box">
        <input type="text" id="targetInput" class="input-field" placeholder="@username or URL">
        <button class="btn-record" onclick="sendAction('RECORD')">Record</button>
      </div>
    </div>
  </section>

  <!-- Activity -->
  <section>
    <h2>Activity</h2>
    <div class="card">
      <div class="activity-list" id="activityList">
        <!-- จะดึงข้อมูลจาก status.json มาแสดงผลอัตโนมัติ -->
        <div class="empty-state">Loading activity...</div>
      </div>
    </div>
  </section>

  <!-- Live from Watchlist -->
  <section>
    <h2>Live from your watchlist</h2>
    <div class="card">
      <div class="empty-state">
        <div class="empty-icon">-</div>
        <p style="font-size: 0.85rem;">No tracked creators are live right now.</p>
      </div>
    </div>
  </section>

  <!-- Overview -->
  <section>
    <h2>Overview</h2>
    <div class="overview-grid">
      <div class="stat-box">
        <span class="stat-number" id="recCount">0</span>
        <span class="stat-label">Recordings</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="capTime">0h</span>
        <span class="stat-label">Captured</span>
      </div>
      <div class="stat-box">
        <span class="stat-number" id="watchCount">0/3</span>
        <span class="stat-label">Watchlist</span>
      </div>
    </div>
  </section>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) tg.expand();

    function sendAction(action) {
      const val = document.getElementById('targetInput').value.trim();
      if (!val) return;
      if (tg) {
        tg.sendData(JSON.stringify({ action: action, value: val }));
        tg.close();
      }
    }

    // ดึงข้อมูลเรียลไทม์จาก status.json บน GitHub
    async function fetchStatus() {
      try {
        const res = await fetch('status.json?t=' + new Date().getTime());
        const data = await res.json();

        // Update Overview Stats
        document.getElementById('recCount').innerText = data.total_recordings || 0;
        document.getElementById('watchCount').innerText = `${data.watchlist?.length || 0}/10`;

        // Update Activity
        const container = document.getElementById('activityList');
        if (data.active_list && data.active_list.length > 0) {
          container.innerHTML = data.active_list.map((item, idx) => `
            ${idx > 0 ? '<div class="divider"></div>' : ''}
            <div class="activity-item">
              <div class="item-left">
                <div class="avatar">${item.username.substring(0,2).toUpperCase()}</div>
                <div class="user-info">
                  <span class="username">@${item.username}</span>
                  <span class="status-meta">Recording...</span>
                </div>
              </div>
              <div style="display: flex; align-items: center; gap: 8px;">
                <span class="badge-recording">Recording</span>
                <button class="btn-action">Stop</button>
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `<div class="empty-state"><p style="font-size:0.85rem">No active recordings</p></div>`;
        }
      } catch (e) {
        console.error(e);
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 5000); // อัปเดตข้อมูลทุกๆ 5 วินาที
  </script>
</body>
</html>
