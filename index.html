<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RecTok Dashboard</title>
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #fe2c55; /* TikTok Red */
            --accent-green: #25d366;
            --text-color: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 16px;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-icon {
            font-size: 24px;
        }

        .brand-title {
            font-size: 18px;
            font-weight: bold;
        }

        /* Profile Greeting */
        .greeting {
            margin-bottom: 20px;
        }

        .greeting h2 {
            font-size: 22px;
        }

        .greeting p {
            color: var(--text-sub);
            font-size: 14px;
        }

        /* Card Section */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 14px;
            color: var(--text-sub);
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Input Form */
        .input-group {
            display: flex;
            gap: 8px;
        }

        input[type="text"] {
            flex: 1;
            background-color: #2a2a2a;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: var(--accent-color);
        }

        .btn {
            background-color: #ffffff;
            color: #000000;
            border: none;
            border-radius: 8px;
            padding: 0 16px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-danger {
            background-color: var(--accent-color);
            color: #fff;
        }

        /* Activity / Notice */
        .empty-state {
            text-align: center;
            color: var(--text-sub);
            font-size: 14px;
            padding: 12px 0;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .stat-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
        }

        .stat-value {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: #1a1a1a;
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-sub);
            font-size: 11px;
            text-decoration: none;
            gap: 4px;
        }

        .nav-item.active {
            color: var(--accent-color);
        }

        .nav-icon {
            font-size: 18px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <div class="header">
        <div class="brand">
            <span class="brand-icon">📹</span>
            <span class="brand-title">RecTok Engine</span>
        </div>
    </div>

    <!-- Greeting -->
    <div class="greeting">
        <h2 id="user-greeting">Hi Streamer</h2>
        <p>Record a LIVE or add to watchlist.</p>
    </div>

    <!-- Quick Record -->
    <div class="card">
        <div class="card-title">Quick record</div>
        <div class="input-group">
            <input type="text" id="target-input" placeholder="@username or URL">
            <button class="btn" onclick="sendAction('RECORD')">Record</button>
        </div>
    </div>

    <!-- Add Watchlist -->
    <div class="card">
        <div class="card-title">Add to Watchlist</div>
        <div class="input-group">
            <input type="text" id="watchlist-input" placeholder="@username or URL">
            <button class="btn btn-danger" onclick="sendAction('ADD_WATCHLIST')">Add</button>
        </div>
    </div>

    <!-- Overview Stats -->
    <div class="card-title" style="margin-left: 4px;">Overview</div>
    <div class="stats-grid">
        <div class="stat-box">
            <div class="stat-value">Ready</div>
            <div class="stat-label">System</div>
        </div>
        <div class="stat-box">
            <div class="stat-value">24/7</div>
            <div class="stat-label">Auto-Scan</div>
        </div>
        <div class="stat-box">
            <div class="stat-value">Telegram</div>
            <div class="stat-label">Upload</div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span>Home</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📋</span>
            <span>Watchlist</span>
        </div>
        <div class="nav-item">
            <span class="nav-icon">📁</span>
            <span>Library</span>
        </div>
    </div>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // ขยายหน้าจอให้เต็ม Telegram

        // ดึงชื่อผู้ใช้ Telegram มาแสดงคำทักทาย
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            document.getElementById('user-greeting').innerText = `Hi ${tg.initDataUnsafe.user.first_name}`;
        }

        // ฟังก์ชันสำหรับส่งข้อมูลกลับไปยัง Telegram Bot (run.py)
        function sendAction(actionType) {
            let inputVal = "";
            
            if (actionType === 'RECORD') {
                inputVal = document.getElementById('target-input').value.trim();
            } else if (actionType === 'ADD_WATCHLIST') {
                inputVal = document.getElementById('watchlist-input').value.trim();
            }

            if (!inputVal) {
                alert("กรุณากรอก Username หรือ ลิงก์ก่อนครับ!");
                return;
            }

            // จัดรูปแบบแพ็กเป็น JSON
            const payload = {
                action: actionType,
                value: inputVal
            };

            // ส่งข้อมูลหา Telegram Bot และปิดหน้า WebApp
            tg.sendData(JSON.stringify(payload));
        }
    </script>
</body>
</html>
